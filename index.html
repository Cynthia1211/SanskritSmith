<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Sanskrit Smith</title>
<link rel="stylesheet" href="css/styles.css" />

<!-- Standard ZIM 016 setup: ZIM depends on CreateJS -->
<script src="https://zimjs.org/cdn/1.5/createjs.js"></script>
<script src="https://zimjs.org/cdn/016/zim_min.js"></script>
<script src="js/setting.js"></script>
<script src="js/game-flow.js"></script>
<script src="js/game-layout.js"></script>
<script src="js/helpers.js"></script>
<script src="js/fetchLevels.js"></script>
<script src="js/letter-processing.js"></script>

<script>
// Define the Frame using the current ZIM syntax.
const frame = new Frame({
    scaling: "fit",
    width: 1200,
    height: 700,
    color: "#555555",
    outerColor: "#333333",
    assets: [
        "game/background.jpeg",
        "game/forgingStation.png",
        "game/SanskritSmith1.png",
        "game/targetBackground.png",
        "tools/toolBackground.png",
        "tools/axe.png",
        "tools/gem.png",
        "tools/hammer.png",
        "tools/hook.png",
        "tools/scissors.png"
    ],
    path: "assets/"
});

frame.on("ready", () => {
    Promise.all([
        new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = SanskritSmith.ASSET_PATHS.targetBackground;
        }),
        new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = SanskritSmith.ASSET_PATHS.toolBackground;
        })
    ]).then(async ([targetBarImage, toolFrameImage]) => {
        const [levels, toolData, characterRules] = await Promise.all([
            SanskritSmith.fetchLevels(),
            SanskritSmith.loadJson("tools.json"),
            SanskritSmith.loadJson("charactersRules.json")
        ]);
        const campaign = SanskritSmith.createCampaign(levels);
        const levelProgressKey = "sanskrit-smith-max-unlocked-level";
        let storedProgress = 0;
        try {
            storedProgress = Number(sessionStorage.getItem(levelProgressKey));
        } catch (error) {
            console.warn("[campaign] Session storage is unavailable; progress will last only until this page closes.");
        }
        let maxUnlockedLevel = Number.isInteger(storedProgress) && storedProgress >= 0
            ? Math.min(storedProgress, levels.length - 1)
            : 0;
        let jumpToLevel = null;
        let level = campaign.level;
        let words = campaign.words;
        let wordIndex = campaign.wordIndex;
        let stepIndex = campaign.stepIndex;
        let currentWord = campaign.word;
        let targetAnimator = null;
        let processingLetterRef;
        let processingLetterBoxRef;
        let processingLetterSizeRef = 0;
        let triggerToolAnimation = null;
        let advanceToNextProcessingStep = null;
        let shakeProcessingLetter = null;
        let updateScissorsCutLines = null;
        let hintCount = 0;
        let attemptsRemaining = 3;
        let attemptsUsedThisWord = 0;
        const hintedWordIndices = new Set();
        const stage = frame.stage;
        stage.enableMouseOver();

        const layout = SanskritSmith.calculateGameLayout(frame, targetBarImage);
        const {
            targetBarX, targetBarWidth,
            toolsAreaX, toolsAreaWidth
        } = layout;

        const addOutlinedText = (text, font, x, y) =>
            SanskritSmith.addOutlinedText(stage, text, font, x, y);

        // Preserve the background aspect ratio and crop from the center to avoid distortion.
        const background = new Pic("game/background.jpeg")
            .addTo(stage)
            .scaleTo(frame.width, frame.height, "outside")
            .center();
        background.x -= frame.width * 0.1;

        // Keep the forging station at its current scale, center it horizontally, and align it with the bottom of the canvas.
        // Add it before the UI so the Tools Area appears above it.
        const forgingStation = new createjs.Bitmap(SanskritSmith.ASSET_PATHS.forgingStation);
        stage.addChildAt(forgingStation, 1);
        forgingStation.image.onload = () => {
            // Scale the image and align it horizontally and with the bottom edge of the canvas.
            forgingStation.scaleX = 0.6;
            forgingStation.scaleY = 0.6;
            const forgingStationDisplayWidth = forgingStation.image.width * forgingStation.scaleX;
            forgingStation.x = toolsAreaX + toolsAreaWidth / 2 - forgingStationDisplayWidth / 2;
            forgingStation.y = frame.height - forgingStation.image.height * 0.45;

            // Position the processing letter above the forging station.
            const processingLetterSize = forgingStationDisplayWidth * 0.8;
            processingLetterSizeRef = processingLetterSize;
            const processingLetterBox = {
                x: forgingStation.x + forgingStationDisplayWidth / 2 - processingLetterSize / 2,
                y: 0
            };
            // Move the processing area slightly lower over the forging station.
            processingLetterBox.y = forgingStation.y - processingLetterSize * 0.62;

            // Keep the character still and hide a configurable part on the right.
            const letterFont = "bold 250px 'Noto Sans Devanagari', 'Nirmala UI', Arial";
            const hiddenRightRatio = 0.45;

            const initialStep = currentWord.targetSlots[stepIndex];
            const processingText = getProcessingLetterText(currentWord, initialStep);
            const processingLetter = new createjs.Text(processingText, letterFont, "#FFFFFF");
            processingLetterRef = processingLetter;
            processingLetterBoxRef = processingLetterBox;
            const processingParts = SanskritSmith.createProcessingLetterParts({
                stage,
                createjs,
                baseLetter: processingLetter,
                box: processingLetterBox,
                size: processingLetterSize
            });
            shakeProcessingLetter = () => {
                const visibleParts = [
                    ...processingParts.visual.letters,
                    ...processingParts.visual.masks
                ].filter(part => part.visible);
                visibleParts.forEach(part => {
                    const homeX = part.x;
                    const homeY = part.y;
                    createjs.Tween.removeTweens(part);
                    createjs.Tween.get(part, {override: true})
                        .to({x: homeX + 8}, 50)
                        .to({x: homeX - 8}, 50)
                        .to({x: homeX + 5}, 50)
                        .to({x: homeX - 5}, 50)
                        .to({x: homeX, y: homeY}, 50)
                        .on("change", () => stage.update());
                });
            };
            const getPartsMode = step => step?.tool?.toLowerCase() === "axe" ? "axe" : "single";
            processingParts.reset(
                processingLetter.text,
                hasProcessingPosition(currentWord.targetSlots[stepIndex]),
                getPartsMode(currentWord.targetSlots[stepIndex])
            );

            const finishWordWithPopup = () => {
                const scoreSettings = SanskritSmith.SCORE_SETTINGS;
                const hintUses = hintedWordIndices.has(wordIndex) ? 1 : 0;
                const hintDeduction = hintUses * scoreSettings.hintDeductScore;
                const attemptsDeduction = attemptsUsedThisWord * scoreSettings.AttemptsDeductScore;
                const clearsLevel = wordIndex === words.length - 1;
                const levelReward = clearsLevel ? scoreSettings.levelScore : 0;
                const earned = scoreSettings.wordScore + levelReward - hintDeduction - attemptsDeduction;
                const breakdown = [
                    {label: "Word completion", value: `$${scoreSettings.wordScore}`},
                    {label: "Hint use", value: hintDeduction ? `-$${hintDeduction}` : "$0"},
                    {label: "Attempts use", value: attemptsDeduction ? `-$${attemptsDeduction}` : "$0"}
                ];
                if (clearsLevel) breakdown.push({label: "Level completion", value: `+$${levelReward}`});

                gameUI.recordDailyCompletion(earned);
                gameUI.showWordScorePopup({
                    earned,
                    breakdown,
                    onContinue: startNextWord
                });
            };

            advanceToNextProcessingStep = () => {
                const nextStep = campaign.advanceStep();
                stepIndex = campaign.stepIndex;
                if (!nextStep) return;
                targetArea.updateProcessingPositionGlow(currentWord, stepIndex);

                const noProcessingPosition = nextStep.processingPosition === ""
                    || nextStep.processingPosition == null;
                const noTool = nextStep.tool === "" || nextStep.tool == null;
                if (noProcessingPosition && noTool) {
                    processingParts.hide();
                    updateProcessingLetter(processingParts, processingLetterRef);
                    stage.update();
                    targetAnimator.animateCompleteConjunct(nextStep, finishWordWithPopup);
                    return;
                }

                processingParts.reset(
                    processingLetterRef.text,
                    hasProcessingPosition(nextStep),
                    getPartsMode(nextStep)
                );
                updateProcessingLetter(processingParts, processingLetterRef);
                stage.update();
            };

            const startNextWord = () => {
                const transition = campaign.completeWord();
                if (transition === "complete") {
                    processingParts.hide();
                    gameUI.updateCampaignStatus(words.length);
                    gameUI.showCampaignComplete();
                    console.info("[campaign] all levels completed");
                    return;
                }

                level = campaign.level;
                if (transition === "level") {
                    maxUnlockedLevel = Math.max(maxUnlockedLevel, campaign.levelIndex);
                    hintCount = 0;
                    hintedWordIndices.clear();
                    gameUI.updateHintButton();
                    attemptsRemaining = 3;
                    gameUI.updateAttemptsLabel();
                    try {
                        sessionStorage.setItem(levelProgressKey, String(maxUnlockedLevel));
                    } catch (error) {
                        console.warn("[campaign] Could not save level progress in session storage.");
                    }
                    gameUI.updateLevelDropdown();
                }
                words = campaign.words;
                wordIndex = campaign.wordIndex;
                stepIndex = campaign.stepIndex;
                currentWord = campaign.word;
                attemptsUsedThisWord = 0;
                targetAnimator.reset();
                targetArea.render(currentWord);
                targetArea.updateProcessingPositionGlow(currentWord, stepIndex);
                gameUI.updateCampaignStatus();
                toolArea.updateForLevel();

                processingParts.reset(
                    processingLetterRef.text,
                    hasProcessingPosition(currentWord.targetSlots[stepIndex]),
                    getPartsMode(currentWord.targetSlots[stepIndex])
                );
                updateProcessingLetter(processingParts, processingLetterRef);
                stage.update();
                console.info("[campaign] started next word", {
                    level: level.id,
                    wordIndex,
                    word: currentWord.word
                });
            };

            jumpToLevel = index => {
                if (index > maxUnlockedLevel || !campaign.startLevel(index)) return false;
                level = campaign.level;
                words = campaign.words;
                wordIndex = campaign.wordIndex;
                stepIndex = campaign.stepIndex;
                currentWord = campaign.word;
                attemptsUsedThisWord = 0;
                targetAnimator.reset();
                hintCount = 0;
                hintedWordIndices.clear();
                gameUI.updateHintButton();
                attemptsRemaining = 3;
                gameUI.updateAttemptsLabel();
                targetArea.render(currentWord);
                targetArea.updateProcessingPositionGlow(currentWord, stepIndex);
                gameUI.updateCampaignStatus();
                toolArea.updateForLevel();
                processingParts.reset(
                    processingLetterRef.text,
                    hasProcessingPosition(currentWord.targetSlots[stepIndex]),
                    getPartsMode(currentWord.targetSlots[stepIndex])
                );
                updateProcessingLetter(processingParts, processingLetterRef);
                stage.update();
                return true;
            };

            const processingLetterInteraction = new createjs.Shape();
            processingLetterInteraction.graphics
                .beginFill("rgba(255, 255, 255, 0.01)")
                .drawRect(0, 0, processingLetterSize, processingLetterSize);
            processingLetterInteraction.x = processingLetterBox.x;
            processingLetterInteraction.y = processingLetterBox.y;
            const processingLetterBorder = new createjs.Shape();
            processingLetterBorder.mouseEnabled = false;
            processingLetterBorder.graphics
                .setStrokeStyle(3)
                .beginStroke("#FFFFFF")
                .drawRect(0, 0, processingLetterSize, processingLetterSize);
            processingLetterBorder.x = processingLetterBox.x;
            processingLetterBorder.y = processingLetterBox.y;
            processingLetterBorder.visible = false;
            const scissorsCutLines = new createjs.Shape();
            scissorsCutLines.mouseEnabled = false;
            const letterProcessor = SanskritSmith.createLetterProcessor({
                stage,
                createjs,
                letterParts: processingParts,
                scissorsCutLines,
                processingLetterBox,
                processingLetterSize,
                letterWidth,
                letterHeight,
                getCurrentStep: () => currentWord.targetSlots[stepIndex],
                getTargetBox: position => targetBoxRefs[position - 1],
                getTargetLetter: position => targetTextRefs[position - 1]?.textFill?.text
                    || currentWord.letters[position - 1]
                    || "",
                removeTargetText: position => {
                    const textRef = targetTextRefs[position - 1];
                    if (!textRef) return;
                    [textRef.textOutline, textRef.textFill].forEach(text => {
                        if (!text) return;
                        createjs.Tween.removeTweens(text);
                        stage.removeChild(text);
                    });
                    targetTextRefs[position - 1] = null;
                },
                animateTargetPositionsToConjunct: (step, onComplete) =>
                    targetAnimator.animateTargetPositionsToConjunct(step, onComplete),
                advanceToNextStep: () => advanceToNextProcessingStep(),
                defaultHiddenRightRatio: hiddenRightRatio
            });
            const showScissorsCutLines = true;
            updateScissorsCutLines = () => {
                const step = currentWord.targetSlots[stepIndex];
                const toolName = step?.tool?.toLowerCase();
                const isAxe = toolName === "axe";
                const isScissors = toolName === "scissors";
                const rule = isAxe || isScissors
                    ? (characterRules[step?.base]?.tools || []).find(candidate =>
                        candidate.tool?.toLowerCase() === toolName
                    )
                    : null;
                if (!rule) {
                    scissorsCutLines.alpha = 1;
                    scissorsCutLines.visible = false;
                    stage.update();
                    return;
                }

                const params = rule.toolParams || {};
                const rightRatio = Number(params.hiddenRightRatio);
                const bottomRatio = Number(params.hiddenBottomRatio);
                const rightCutRatio = Math.max(0, Math.min(1, 0.5 + (Number.isFinite(rightRatio) ? rightRatio : hiddenRightRatio)));
                const effectiveBottomRatio = isAxe ? -0.5 : Number.isFinite(bottomRatio) ? bottomRatio : 0.45;
                const bottomCutRatio = Math.max(0, Math.min(1, 0.5 + effectiveBottomRatio));
                const cutX = processingLetterBox.x + processingLetterSize * rightCutRatio;
                const cutY = processingLetterBox.y + processingLetterSize * bottomCutRatio;
                scissorsCutLines.x = scissorsCutLines.y = 0;
                scissorsCutLines.regX = scissorsCutLines.regY = 0;
                scissorsCutLines.scaleX = scissorsCutLines.scaleY = 1;
                scissorsCutLines.alpha = 1;
                scissorsCutLines.graphics.clear()
                    .setStrokeStyle(2)
                    .setStrokeDash([6, 5], 0)
                    .beginStroke("#ff0000")
                    .moveTo(cutX, processingLetterBox.y)
                    .lineTo(cutX, processingLetterBox.y + processingLetterSize);
                if (isAxe || isScissors) {
                    scissorsCutLines.graphics
                        .moveTo(processingLetterBox.x, cutY)
                        .lineTo(processingLetterBox.x + processingLetterSize, cutY);
                }
                scissorsCutLines.visible = showScissorsCutLines;
                stage.update();
            };
            triggerToolAnimation = toolName => {
                const step = currentWord.targetSlots[stepIndex];
                const base = step?.base;
                if (typeof base === "string" && base && processingLetter.text !== base) {
                    processingLetter.text = base;
                    processingParts.setText(base);
                    if (updateScissorsCutLines) updateScissorsCutLines();
                    stage.update();
                }

                const rulesForLetter = characterRules[step?.base]?.tools || [];
                const rule = rulesForLetter.find(candidate =>
                    candidate.tool
                    && step?.tool
                    && candidate.tool.toLowerCase() === step.tool.toLowerCase()
                    && candidate.tool.toLowerCase() === toolName.toLowerCase()
                );
                const isLevelHammerStep = step?.tool?.toLowerCase() === "hammer"
                    && toolName.toLowerCase() === "hammer";
                if (!rule && !isLevelHammerStep) {
                    console.warn("[characterRules] no matching rule; using generic animation", {
                        base: step?.base,
                        requiredTool: step && step.tool,
                        draggedTool: toolName
                    });
                }
                return letterProcessor.run(
                    step?.toolAnimation || rule?.toolAnimation || (isLevelHammerStep ? "hammerForge" : undefined),
                    step?.toolParams || rule?.toolParams || {}
                );
            };
            stage.addChild(processingLetterInteraction);
            stage.addChild(scissorsCutLines);
            stage.addChild(processingLetterBorder);
            updateScissorsCutLines();

            stage.update();
        };

        // ==========================================
        // 1. Top Target Bar area
        // ==========================================
        const targetArea = SanskritSmith.createTargetArea({
            stage,
            createjs,
            layout,
            addOutlinedText
        });
        const targetTextRefs = targetArea.targetTextRefs;
        const targetBoxRefs = targetArea.targetBoxRefs;
        const {letterWidth, letterHeight, letterGap} = targetArea;
        targetAnimator = SanskritSmith.createConjunctAnimator({
            stage,
            createjs,
            targetArea,
            targetBarX,
            targetBarWidth,
            addOutlinedText
        });
        targetArea.render(currentWord);
        targetArea.updateProcessingPositionGlow(currentWord, stepIndex);

        function updateProcessingLetter(letterParts, processingLetter) {
            const step = currentWord.targetSlots[stepIndex];
            const text = getProcessingLetterText(currentWord, step);
            processingLetter.text = text;
            letterParts.setText(text);
            if (updateScissorsCutLines) updateScissorsCutLines();
        }

        function getProcessingLetterText(word, step) {
            if (!word || !step) return "";
            if (step.processingPosition === "" || step.processingPosition == null) return "";
            const position = Number(step.processingPosition);
            if (!Number.isInteger(position) || position < 1) return "";
            return word.letters[position - 1] || "";
        }

        function hasProcessingPosition(step) {
            if (!step || step.processingPosition === "" || step.processingPosition == null) return false;
            const position = Number(step.processingPosition);
            return Number.isInteger(position)
                && position >= 1
                && position <= (currentWord?.letters?.length || 0);
        }

        const toolArea = SanskritSmith.createToolArea({
            stage,
            createjs,
            layout,
            toolFrameImage,
            toolData,
            levels,
            getLevel: () => level,
            getCurrentWord: () => currentWord,
            getCurrentStep: () => currentWord.targetSlots[stepIndex],
            getProcessingLetterBox: () => processingLetterBoxRef,
            getProcessingLetterSize: () => processingLetterSizeRef,
            addOutlinedText,
            onCorrectTool: toolName => {
                if (triggerToolAnimation) triggerToolAnimation(toolName);
            },
            onIncorrectTool: () => {
                if (shakeProcessingLetter) shakeProcessingLetter();
                if (attemptsRemaining <= 0) return;
                attemptsRemaining -= 1;
                attemptsUsedThisWord += 1;
                gameUI.updateAttemptsLabel();
            }
        });
        toolArea.updateForLevel();

        const gameUI = SanskritSmith.createGameUI({
            stage,
            frame,
            createjs,
            layout,
            levels,
            campaign,
            getCampaignState: () => ({
                level,
                words,
                wordIndex,
                levelIndex: campaign.levelIndex,
                hintedWordIndices
            }),
            getMaxUnlockedLevel: () => maxUnlockedLevel,
            getHintCount: () => hintCount,
            getAttemptsRemaining: () => attemptsRemaining,
            onHint: () => {
                if (!currentWord) return null;
                const alreadyHinted = hintedWordIndices.has(wordIndex);
                if (!alreadyHinted) {
                    if (hintCount >= 2) return null;
                    hintedWordIndices.add(wordIndex);
                    hintCount += 1;
                }
                return {wordIndex, newHint: !alreadyHinted};
            },
            onLevelSelect: index => jumpToLevel(index)
        });

        // Keep tool artwork above the rest of the scene, including the info panel.
        toolArea.displayRefs.forEach(tool => stage.addChild(tool));
        stage.update(); // Refresh the stage.
    }).catch(error => {
        console.error("[startup] Game initialization failed:", error);
        const stage = frame.stage;
        const message = new createjs.Text(
            `Unable to start the game.\n${error.message}`,
            "bold 22px Arial",
            "#FFFFFF"
        );
        message.textAlign = "center";
        message.textBaseline = "middle";
        message.x = frame.width / 2;
        message.y = frame.height / 2;
        stage.addChild(message);
        stage.update();
    });
});
</script>
</head>
<body>
</body>
</html>
