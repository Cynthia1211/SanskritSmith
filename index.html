<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Sanskrit Smith</title>
<link rel="stylesheet" href="css/styles.css" />

<!-- Standard ZIM 016 setup: ZIM depends on CreateJS -->
<script src="https://zimjs.org/cdn/1.5/createjs.js"></script>
<script src="https://zimjs.org/cdn/016/zim_min.js"></script>
<script src="js/game-data.js"></script>
<script src="js/game-flow.js"></script>
<script src="js/helpers.js"></script>
<script src="js/letter-processing.js"></script>
<script src="js/target-layout.js"></script>
<script src="js/tool-interactions.js"></script>

<script>
// Define the Frame using the current ZIM syntax.
const frame = new Frame({
    scaling: "fit",
    width: 1200,
    height: 700,
    color: "#555555",
    outerColor: "#333333",
    assets: [
        "background.jpeg",
        "forgingStation.png",
        "toolBackground.png",
        "targetBackground.png",
        "axe.png",
        "gem.png",
        "hammer.png",
        "hook.png",
        "scissors.png"
    ],
    path: "assets/"
});

frame.on("ready", () => {
    Promise.all([
        new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = "assets/targetBackground.png";
        }),
        new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = "assets/toolBackground.png";
        })
    ]).then(async ([targetBarImage, toolFrameImage]) => {
        const [levelData, toolData, characterRules] = await Promise.all([
            SanskritSmith.loadJson("levels.json", SanskritSmith.fallbackLevels),
            SanskritSmith.loadJson("tools.json", SanskritSmith.fallbackTools),
            SanskritSmith.loadJson("charactersRules.json", SanskritSmith.fallbackCharacters)
        ]);
        const campaign = SanskritSmith.createCampaign(levelData.levels);
        let level = campaign.level;
        let words = campaign.words;
        let wordIndex = campaign.wordIndex;
        let stepIndex = campaign.stepIndex;
        let currentWord = campaign.word;
        let targetTextRefs = [];
        let targetBoxRefs = [];
        let targetConjunctAnimationRunning = false;
        let processingLetterRef;
        let processingLetterBoxRef;
        let processingLetterSizeRef = 0;
        let triggerToolAnimation = null;
        let advanceToNextProcessingStep = null;
        const toolDisplayRefs = [];
        const toolDisplayGroups = [];
        const selectedWordLabels = [];
        let levelTitle;
        let levelRequirement;
        let progressFill;
        const stage = frame.stage;
        stage.enableMouseOver();

        // Main layout: left two-thirds for the game area, right one-third for the info area.
        const leftAreaWidth = frame.width * 2 / 3;
        const rightAreaX = leftAreaWidth;
        const rightAreaWidth = frame.width - leftAreaWidth;

        const targetBarImageWidth = targetBarImage.naturalWidth || targetBarImage.width;
        const targetBarImageHeight = targetBarImage.naturalHeight || targetBarImage.height;
        const targetBarTargetWidth = leftAreaWidth * 0.9;
        const targetBarY = 5;
        const targetBarScaleX = targetBarTargetWidth / targetBarImageWidth;
        const targetBarScaleY = 150 / targetBarImageHeight;
        const targetBarWidth = targetBarImageWidth * targetBarScaleX;
        const targetBarHeight = targetBarImageHeight * targetBarScaleY;
        const targetBarX = (leftAreaWidth - targetBarWidth) / 2;

        const toolsAreaX = (leftAreaWidth - leftAreaWidth * 0.98) / 2;
        const toolsAreaWidth = leftAreaWidth * 0.98;
        const toolsAreaHeight = 150;
        const toolsAreaY = frame.height - toolsAreaHeight;

        const addOutlinedText = (text, font, x, y) =>
            SanskritSmith.addOutlinedText(stage, text, font, x, y);

        // Preserve the background aspect ratio and crop from the center to avoid distortion.
        const background = new Pic("background.jpeg")
            .addTo(stage)
            .scaleTo(frame.width, frame.height, "outside")
            .center();
        background.x -= frame.width * 0.1;

        // Keep the forging station at its current scale, center it horizontally, and align it with the bottom of the canvas.
        // Add it before the UI so the Tools Area appears above it.
        const forgingStation = new createjs.Bitmap("assets/forgingStation.png");
        stage.addChildAt(forgingStation, 1);
        forgingStation.image.onload = () => {
            // Scale the image and align it horizontally and with the bottom edge of the canvas.
            forgingStation.scaleX = 0.6;
            forgingStation.scaleY = 0.6;
            const forgingStationDisplayWidth = forgingStation.image.width * forgingStation.scaleX;
            forgingStation.x = toolsAreaX + toolsAreaWidth / 2 - forgingStationDisplayWidth / 2;
            forgingStation.y = frame.height - forgingStation.image.height * 0.45;

            // Add a temporary processing letter frame above the forging station.
            const processingLetterSize = forgingStationDisplayWidth * 0.8;
            processingLetterSizeRef = processingLetterSize;
            const processingLetterBox = new createjs.Shape();
            processingLetterBox.graphics
                .setStrokeStyle(4)
                .beginStroke("#FFFFFF")
                .drawRect(0, 0, processingLetterSize, processingLetterSize);
            processingLetterBox.x = forgingStation.x
                + forgingStationDisplayWidth / 2
                - processingLetterSize / 2;
            // Overlap the forging station by 25% of the square's height.
            processingLetterBox.y = forgingStation.y - processingLetterSize * 0.7;
            stage.addChild(processingLetterBox);

            // Keep the character still and hide a configurable part on the right.
            const letterFont = "bold 400px 'Noto Sans Devanagari', 'Nirmala UI', Arial";
            const hiddenRightRatio = 0.45;

            const processingPosition = currentWord.targetSlots[stepIndex].processingPosition;
            const processingText = processingPosition === ""
                ? ""
                : currentWord.letters[Number(processingPosition) - 1];
            const processingLetter = new createjs.Text(processingText, letterFont, "#FFFFFF");
            processingLetterRef = processingLetter;
            processingLetterBoxRef = processingLetterBox;
            const processingParts = SanskritSmith.createProcessingLetterParts({
                stage,
                createjs,
                baseLetter: processingLetter,
                box: processingLetterBox,
                size: processingLetterSize
            });
            const getPartsMode = step => step?.tool?.toLowerCase() === "axe" ? "axe" : "single";
            processingParts.reset(processingLetter.text, true, getPartsMode(currentWord.targetSlots[stepIndex]));

            advanceToNextProcessingStep = () => {
                const nextStep = campaign.advanceStep();
                stepIndex = campaign.stepIndex;
                if (!nextStep) return;
                updateProcessingPositionGlow();

                const noProcessingPosition = nextStep.processingPosition === ""
                    || nextStep.processingPosition == null;
                const noTool = nextStep.tool === "" || nextStep.tool == null;
                if (noProcessingPosition && noTool) {
                    processingParts.hide();
                    updateProcessingLetter(processingParts, processingLetterRef);
                    stage.update();
                    animateCompleteConjunct(nextStep, () => {
                        startNextWord();
                    });
                    return;
                }

                processingParts.reset(
                    processingLetterRef.text,
                    nextStep.processingPosition !== "",
                    getPartsMode(nextStep)
                );
                updateProcessingLetter(processingParts, processingLetterRef);
                stage.update();
            };

            const startNextWord = () => {
                const transition = campaign.completeWord();
                if (transition === "complete") {
                    processingParts.hide();
                    if (levelTitle) levelTitle.text = "All levels complete!";
                    if (levelRequirement) levelRequirement.text = "You completed every selected word.";
                    if (progressFill) {
                        progressFill.graphics.clear()
                            .beginFill("#FFF2A8")
                            .drawRoundRect(0, 0, 260, 16, 8);
                    }
                    stage.update();
                    console.info("[campaign] all levels completed");
                    return;
                }

                level = campaign.level;
                words = campaign.words;
                wordIndex = campaign.wordIndex;
                stepIndex = campaign.stepIndex;
                currentWord = campaign.word;
                targetConjunctAnimationRunning = false;
                renderTargetLetters();
                updateProcessingPositionGlow();
                updateCampaignStatus();
                updateToolsForLevel();

                processingParts.reset(
                    processingLetterRef.text,
                    true,
                    getPartsMode(currentWord.targetSlots[stepIndex])
                );
                updateProcessingLetter(processingParts, processingLetterRef);
                stage.update();
                console.info("[campaign] started next word", {
                    level: level.id,
                    wordIndex,
                    word: currentWord.word
                });
            };

            const processingLetterInteraction = new createjs.Shape();
            processingLetterInteraction.graphics
                .beginFill("rgba(255, 255, 255, 0.01)")
                .drawRect(0, 0, processingLetterSize, processingLetterSize);
            processingLetterInteraction.x = processingLetterBox.x;
            processingLetterInteraction.y = processingLetterBox.y;
            const letterProcessor = SanskritSmith.createLetterProcessor({
                stage,
                createjs,
                letterParts: processingParts,
                processingLetterBox,
                processingLetterSize,
                letterWidth,
                letterHeight,
                getCurrentStep: () => currentWord.targetSlots[stepIndex],
                getTargetBox: position => targetBoxRefs[position - 1],
                animateTargetPositionsToConjunct,
                advanceToNextStep: () => advanceToNextProcessingStep(),
                defaultHiddenRightRatio: hiddenRightRatio
            });

            triggerToolAnimation = toolName => {
                const step = currentWord.targetSlots[stepIndex];
                const rulesForLetter = characterRules[processingLetter.text] || [];
                const rule = rulesForLetter.find(candidate =>
                    candidate.tool
                    && step?.tool
                    && candidate.tool.toLowerCase() === step.tool.toLowerCase()
                    && candidate.tool.toLowerCase() === toolName.toLowerCase()
                );
                const isLevelHammerStep = step?.tool?.toLowerCase() === "hammer"
                    && toolName.toLowerCase() === "hammer";
                if (!rule && !isLevelHammerStep) {
                    console.warn("[characterRules] no matching rule; using generic animation", {
                        character: processingLetter.text,
                        requiredTool: step && step.tool,
                        draggedTool: toolName
                    });
                }
                return letterProcessor.run(
                    rule && rule.toolAnimation || (isLevelHammerStep ? "hammerForge" : undefined),
                    rule && rule.toolParams || {}
                );
            };
            stage.addChild(processingLetterInteraction);

            stage.update();
        };

        // ==========================================
        // 1. Top Target Bar area
        // ==========================================
        // Stretch targetBackground.png to fill the existing Target Bar dimensions.
        const targetBar = new createjs.Bitmap("assets/targetBackground.png");
        targetBar.x = targetBarX;
        targetBar.y = targetBarY;
        targetBar.scaleX = targetBarScaleX;
        targetBar.scaleY = targetBarScaleY;
        targetBar.image.onload = () => stage.update();
        stage.addChild(targetBar);
        
        new Label({text: "Target Bar", size: 24, color: "#FFFFFF"})
            .loc(70, targetBarY + 15);

        let letterData = currentWord.initial.map(value => value === "_" ? "?" : value);
        const letterWidth = 85;
        const letterHeight = 85;
        const letterGap = 30; // Keep the current spacing between boxes.
        let letterGroupWidth = letterWidth * letterData.length + letterGap * (letterData.length - 1);
        let letterStartX = targetBarX + (targetBarWidth - letterGroupWidth) / 2;
        const letterY = targetBarY + targetBarHeight / 2 - letterHeight / 2;

        function renderTargetLetters() {
            targetTextRefs.forEach(textRef => {
                if (!textRef) return;
                [textRef.textOutline, textRef.textFill].forEach(text => {
                    createjs.Tween.removeTweens(text);
                    stage.removeChild(text);
                });
            });
            targetBoxRefs.forEach(box => {
                createjs.Tween.removeTweens(box);
                stage.removeChild(box);
            });
            targetTextRefs = [];
            targetBoxRefs = [];

            letterData = currentWord.initial.map(value => value === "_" ? "?" : value);
            letterGroupWidth = letterWidth * letterData.length + letterGap * (letterData.length - 1);
            letterStartX = targetBarX + (targetBarWidth - letterGroupWidth) / 2;

            letterData.forEach((text, i) => {
                const letterBox = new createjs.Shape();
                if (currentWord.initial[i] === "_") {
                    letterBox.graphics
                        .setStrokeStyle(4)
                        .setStrokeDash([6, 4])
                        .beginStroke("#FFFFFF")
                        .beginFill("rgba(245, 232, 200, 0.2)")
                        .drawRoundRect(0, 0, letterWidth, letterHeight, 12);
                } else {
                    letterBox.graphics
                        .setStrokeStyle(2)
                        .beginStroke("rgba(255, 255, 255, 0.45)")
                        .drawRoundRect(0, 0, letterWidth, letterHeight, 12);
                }
                letterBox.x = letterStartX + i * (letterWidth + letterGap);
                letterBox.y = letterY;
                stage.addChild(letterBox);
                targetBoxRefs.push(letterBox);

                const textRef = addOutlinedText(
                    text,
                    "bold 50px Arial",
                    letterBox.x + letterWidth / 2,
                    letterBox.y + letterHeight / 2
                );
                targetTextRefs.push(textRef);
            });
        }
        renderTargetLetters();

        function updateProcessingPositionGlow() {
            targetBoxRefs.forEach(box => { box.shadow = null; });
            const step = currentWord && currentWord.targetSlots[stepIndex];
            const position = Number(step && step.processingPosition);
            if (!Number.isInteger(position) || position < 1 || position > targetBoxRefs.length) return;
            targetBoxRefs[position - 1].shadow = new createjs.Shadow("#FFD700", 0, 0, 18);
        }
        updateProcessingPositionGlow();

        const targetBarInteraction = new createjs.Shape();
        targetBarInteraction.graphics
            .beginFill("rgba(255, 255, 255, 0.01)")
            .drawRect(0, 0, targetBarWidth, targetBarHeight);
        targetBarInteraction.x = targetBarX;
        targetBarInteraction.y = targetBarY;
        targetBarInteraction.cursor = "pointer";
        targetBarInteraction.on("click", () => {
            const step = currentWord.targetSlots[stepIndex];
            console.log("[targetConjunct] targetbar clicked", {
                stepIndex,
                targetPositions: step && step.targetPositions,
                targetConjunct: step && step.targetConjunct
            });
            if (!step) return;
            const isCompleteStep = SanskritSmith.isCompleteTargetStep(step);
            if (isCompleteStep) animateCompleteConjunct(step);
            else animateTargetPositionsToConjunct(step);
        });
        stage.addChild(targetBarInteraction);

        function updateProcessingLetter(letterParts, processingLetter) {
            const step = currentWord.targetSlots[stepIndex];
            const position = step && step.processingPosition;
            const text = position === "" || position === undefined
                ? ""
                : currentWord.letters[Number(position) - 1];
            processingLetter.text = text;
            letterParts.setText(text);
        }

        function animateTargetPositionsToConjunct(step, onComplete) {
            animateConjunctPositions(step, onComplete, false);
        }

        function animateCompleteConjunct(step, onComplete) {
            window.setTimeout(() => {
                animateConjunctPositions(step, onComplete, true);
            }, 500);
        }

        function animateConjunctPositions(step, onComplete, completeMode) {
            console.log("[targetConjunct] animation started", {
                targetPositions: step && step.targetPositions,
                targetConjunct: step && step.targetConjunct
            });
            if (targetConjunctAnimationRunning) return;
            targetConjunctAnimationRunning = true;

            const processingPositionIsEmpty = step.processingPosition === ""
                || step.processingPosition == null;
            const toolIsEmpty = step.tool === "" || step.tool == null;
            const isFinalStep = completeMode || (processingPositionIsEmpty && toolIsEmpty);

            const positions = SanskritSmith.getTargetPositions(step, targetBoxRefs.length);
            if (!positions.length) {
                targetConjunctAnimationRunning = false;
                if (onComplete) onComplete();
                return;
            }

            const firstPosition = positions[0];
            const lastPosition = positions[positions.length - 1];
            const left = letterStartX + (firstPosition - 1) * (letterWidth + letterGap);
            const right = letterStartX + (lastPosition - 1) * (letterWidth + letterGap) + letterWidth;
            const processingPosition = Number(step.processingPosition);
            const hasProcessingPosition = Number.isInteger(processingPosition)
                && processingPosition > 0
                && processingPosition <= targetBoxRefs.length;
            const centerX = isFinalStep
                ? SanskritSmith.getTargetSlotCenterX(firstPosition, letterStartX, letterWidth, letterGap)
                : hasProcessingPosition
                    ? SanskritSmith.getTargetSlotCenterX(processingPosition, letterStartX, letterWidth, letterGap)
                    : (left + right) / 2;
            const centerY = letterY + letterHeight / 2;
            const collapseTargets = [];

            positions.forEach(position => {
                const slotX = letterStartX + (position - 1) * (letterWidth + letterGap);
                const textRef = targetTextRefs[position - 1];
                const box = targetBoxRefs[position - 1];
                if (textRef) {
                    [textRef.textOutline, textRef.textFill].forEach(text => {
                        createjs.Tween.removeTweens(text);
                        text.x = slotX + letterWidth / 2;
                        text.y = centerY;
                        text.scaleX = 1;
                        text.scaleY = 1;
                        text.alpha = 1;
                        text.visible = true;
                        collapseTargets.push(text);
                    });
                }
                if (box) {
                    createjs.Tween.removeTweens(box);
                    box.regX = letterWidth / 2;
                    box.regY = letterHeight / 2;
                    box.x = slotX + letterWidth / 2;
                    box.y = centerY;
                    box.scaleX = 1;
                    box.scaleY = 1;
                    box.visible = true;
                    collapseTargets.push(box);
                }
            });

            let remaining = collapseTargets.length;
            let finished = false;
            const finishCollapse = () => {
                if (finished) return;
                finished = true;
                console.log("[targetConjunct] all collapse tweens finished", {
                    targetConjunct: step.targetConjunct,
                    replacementPosition: firstPosition
                });
                collapseTargets.forEach(target => {
                    createjs.Tween.removeTweens(target);
                    target.visible = false;
                    stage.removeChild(target);
                });
                // Clear every collapsed slot's text ref so a later step cannot
                // make stale letters visible again when it resets tween state.
                positions.forEach(position => {
                    targetTextRefs[position - 1] = null;
                });

                const replacementX = isFinalStep
                    ? targetBarX + targetBarWidth / 2
                    : SanskritSmith.getTargetSlotCenterX(firstPosition, letterStartX, letterWidth, letterGap);
                const replacementText = addOutlinedText(
                    step.targetConjunct || "",
                    "bold 50px Arial",
                    replacementX,
                    centerY
                );
                targetTextRefs[firstPosition - 1] = replacementText;
                if (isFinalStep) {
                    let displayFinished = false;
                    const finishDisplay = () => {
                        if (displayFinished) return;
                        displayFinished = true;
                        targetConjunctAnimationRunning = false;
                        stage.update();
                        if (onComplete) onComplete();
                    };
                    [replacementText.textOutline, replacementText.textFill].forEach(text => {
                        text.alpha = 0;
                    });
                    createjs.Tween.get(replacementText.textOutline)
                        .to({alpha: 1}, 350)
                        .on("change", () => stage.update());
                    const fillTween = createjs.Tween.get(replacementText.textFill)
                        .to({alpha: 1}, 350)
                        .on("change", () => stage.update());
                    fillTween.call(finishDisplay);
                    window.setTimeout(finishDisplay, 400);
                    stage.update();
                    return;
                }
                console.log("[targetConjunct] replacement created", {
                    text: replacementText.textFill.text,
                    x: replacementText.textFill.x,
                    y: replacementText.textFill.y,
                    visible: replacementText.textFill.visible,
                    stageChildCount: stage.numChildren
                });
                stage.update();
                targetConjunctAnimationRunning = false;
                if (onComplete) onComplete();
            };

            if (!remaining) {
                finishCollapse();
                return;
            }

            collapseTargets.forEach(target => {
                createjs.Tween.get(target)
                    .to({x: centerX, y: centerY, scaleX: 0, scaleY: 0, alpha: 0}, 400)
                    .on("change", () => stage.update())
                    .call(() => {
                        remaining -= 1;
                        console.log("[targetConjunct] collapse tween completed", {
                            remaining,
                            total: collapseTargets.length
                        });
                        if (remaining === 0) finishCollapse();
                    });
            });

            // Keep the replacement from depending exclusively on CreateJS
            // completion callbacks: the collapse visuals can finish even when a
            // callback is missed (for example, after another tween was removed).
            window.setTimeout(() => {
                if (!finished) {
                    console.warn("[targetConjunct] using timed completion fallback", {
                        remaining,
                        targetConjunct: step.targetConjunct
                    });
                    finishCollapse();
                }
            }, 450);
        }

        // ==========================================
        // 2. Bottom Tools Area
        // ==========================================
        // Transparent tool area with a white outline marking its position.
        new Rectangle(toolsAreaWidth, toolsAreaHeight, null, "#FFFFFF", 2)
            .loc(toolsAreaX, toolsAreaY);

        new Label({text: "Tools Area", size: 24, color: "#FFFFFF"})
            .loc(70, toolsAreaY + 15);

        // Create one visual for every campaign tool, then reveal only this level's options.
        const toolNamesForCampaign = [...new Set(levelData.levels.flatMap(levelConfig =>
            levelConfig.toolsOptions || []
        ))];
        const availableTools = toolNamesForCampaign
            .map(name => toolData.find(toolInfo => toolInfo.toolName.toLowerCase() === name.toLowerCase()))
            .filter(Boolean);

        function updateToolsForLevel() {
            const allowedToolNames = level.toolsOptions || currentWord.toolsOptions || [];
            const allowedTools = new Set(allowedToolNames.map(name => name.toLowerCase()));
            const visibleGroups = toolDisplayGroups.filter(group =>
                allowedTools.has(group.toolName.toLowerCase())
            );
            const visibleWidth = visibleGroups.reduce((total, group) => total + group.width, 0)
                + toolGap * Math.max(0, visibleGroups.length - 1);
            let nextX = toolsAreaX + (toolsAreaWidth - visibleWidth) / 2;

            toolDisplayGroups.forEach(group => {
                const visible = allowedTools.has(group.toolName.toLowerCase());
                group.displays.forEach(display => { display.visible = visible; });
                if (!visible) return;
                group.moveTo(nextX);
                nextX += group.width + toolGap;
            });
        }
        const toolCount = availableTools.length;
        const toolGap = 0;
        const toolTop = toolsAreaY + toolsAreaHeight * 0.25;
        const toolTargetHeight = toolsAreaHeight * 0.7;
        const toolFrameImageWidth = toolFrameImage.naturalWidth || toolFrameImage.width;
        const toolFrameImageHeight = toolFrameImage.naturalHeight || toolFrameImage.height;
        const baseToolScale = Math.min(
            toolTargetHeight / toolFrameImageHeight,
            toolsAreaWidth / (toolCount * toolFrameImageWidth + toolGap * (toolCount - 1))
        );
        const toolFrameScale = 1.2;
        const toolScale = baseToolScale * toolFrameScale;
        const toolWidth = toolFrameImageWidth * toolScale;
        const actualToolHeight = toolFrameImageHeight * toolScale;
        const toolGroupWidth = toolWidth * toolCount + toolGap * (toolCount - 1);
        const toolStartX = toolsAreaX + (toolsAreaWidth - toolGroupWidth) / 2;
        // Tool order: axe, scissors, gem, hook, hammer.
        const toolCenterY = toolTop; // Align the tool center with the top edge of its Tool frame.

        for (let i = 0; i < toolCount; i++) {
            const toolInfo = availableTools[i];
            const toolX = toolStartX + i * (toolWidth + toolGap);
            // Keep the Tool frame fixed; do not add drag events to it.
            let toolBox = new createjs.Bitmap("assets/toolBackground.png");
            toolBox.scaleX = toolWidth / toolFrameImageWidth;
            toolBox.scaleY = actualToolHeight / toolFrameImageHeight;
            toolBox.x = toolX;
            toolBox.y = toolTop;
            toolBox.image.onload = () => stage.update();
            stage.addChild(toolBox);
            const toolVisuals = [toolBox];

            // Preserve the tool image aspect ratio and center it in its Tool frame.
            const tool = new createjs.Bitmap("assets/" + toolInfo.asset);
            const originalToolX = toolX + toolWidth / 2;
            const originalToolY = toolCenterY * 1.01;
            let interactionAttached = false;
            let setToolHomePosition = null;
            let toolDisplayGroup = null;

            const setupTool = () => {
                const maxToolWidth = toolWidth * 0.8;
                const maxToolHeight = actualToolHeight * 0.8;
                const toolScale = Math.min(
                    maxToolWidth / tool.image.width,
                    maxToolHeight / tool.image.height
                );
                tool.scaleX = toolScale * 0.95;
                tool.scaleY = toolScale * 0.95;
                tool.regX = tool.image.width / 2;
                tool.regY = tool.image.height / 2;
                tool.x = (toolDisplayGroup ? toolDisplayGroup.x : toolX) + toolWidth / 2;
                tool.y = originalToolY;
                if (!interactionAttached) {
                    interactionAttached = true;
                    const toolInteraction = SanskritSmith.attachToolInteraction({
                        tool,
                        stage,
                        createjs,
                        originalX: originalToolX,
                        originalY: originalToolY,
                        getCurrentStep: () => currentWord.targetSlots[stepIndex],
                        processingLetterBox: () => processingLetterBoxRef,
                        processingLetterSize: () => processingLetterSizeRef,
                        isCorrectTool: step => step.tool
                            && toolInfo.toolName.toLowerCase() === step.tool.toLowerCase(),
                        onCorrectDrop: () => {
                            if (triggerToolAnimation) triggerToolAnimation(toolInfo.toolName);
                        }
                    });
                    setToolHomePosition = toolInteraction.setHomePosition;
                }
                if (setToolHomePosition) setToolHomePosition(tool.x, tool.y);
                stage.update();
            };

            tool.image.onload = setupTool;
            if (tool.image.complete) setupTool();
            stage.addChild(tool);
            toolVisuals.push(tool);
            toolDisplayRefs.push(tool);

            // Center the tool name and effect text in the lower text area.
            const toolTextCenterX = toolBox.x + toolWidth / 2 ;
            const toolTextAreaTop = toolTop + actualToolHeight * 0.55;
            const toolTextAreaBottom = toolTop + actualToolHeight - 8;
            const toolTextCenterY = (toolTextAreaTop + toolTextAreaBottom) / 2;

            const toolNameText = addOutlinedText(
                toolInfo.label || toolInfo.toolName,
                "bold 21px Arial",
                toolTextCenterX,
                toolTextCenterY - 20
            );
            const toolEffectText = addOutlinedText(
                toolInfo.toolEffect || "tool effect",
                "16px Arial",
                toolTextCenterX,
                toolTextCenterY + 5
            );
            toolVisuals.push(
                toolNameText.textOutline,
                toolNameText.textFill,
                toolEffectText.textOutline,
                toolEffectText.textFill
            );
            toolDisplayGroup = {
                toolName: toolInfo.toolName,
                displays: toolVisuals,
                width: toolWidth,
                x: toolX,
                moveTo(nextX) {
                    const offsetX = nextX - this.x;
                    this.displays.forEach(display => { display.x += offsetX; });
                    this.x = nextX;
                    if (setToolHomePosition) setToolHomePosition(tool.x, tool.y);
                }
            };
            toolDisplayGroups.push(toolDisplayGroup);

        }
        updateToolsForLevel();

        // ==========================================
        // 3. Right Info Area
        // ==========================================
        const infoAreaWidth = rightAreaWidth * 0.85;
        const infoAreaX = rightAreaX + (rightAreaWidth - infoAreaWidth) / 2;
        const infoAreaHeight = 620;
        const infoSectionWidth = infoAreaWidth * 0.9;
        const infoSectionX = infoAreaX + (infoAreaWidth - infoSectionWidth) / 2;
        const infoArea = new createjs.Shape();
        infoArea.graphics
            .beginFill("rgba(204, 204, 204, 0.3)")
            // .setStrokeStyle(6)
            // .beginStroke("#000000")
            // .drawRoundRect(0, 0, 330, 620, 16)
            // .setStrokeStyle(4)
            // .beginStroke("#FFF2A8")
            .drawRoundRect(0, 0, infoAreaWidth, infoAreaHeight, 16);
        infoArea.x = infoAreaX;
        infoArea.y = 40;
        stage.addChild(infoArea);

        const infoTitle = new createjs.Text("Sanskrit Smith", "bold 40px Arial", "#FFFFFF");
        infoTitle.textAlign = "left";
        infoTitle.textBaseline = "middle";
        infoTitle.x = 840;
        infoTitle.y = 68;
        stage.addChild(infoTitle);

        // Control buttons above General Status.
        const controlButtonWidth = 90;
        const controlButtonHeight = 24;
        const controlButtonGap = 10;
        const controlButtonRowWidth = controlButtonWidth * 3 + controlButtonGap * 2;
        const controlButtonY = 150 - controlButtonHeight * 1.5;
        const controlButtonLabels = ["How to Play", "Music", "SFX"];

        controlButtonLabels.forEach((label, i) => {
            const button = new createjs.Shape();
            button.graphics
                .beginFill("#FFF2A8")
                .setStrokeStyle(2)
                .beginStroke("#000000")
                .drawRoundRect(0, 0, controlButtonWidth, controlButtonHeight, 6);
            button.x = infoAreaX + (infoAreaWidth - controlButtonRowWidth) / 2
                + i * (controlButtonWidth + controlButtonGap);
            button.y = controlButtonY;
            button.cursor = "pointer";
            stage.addChild(button);

            const buttonText = new createjs.Text(label, "bold 12px Arial", "#000000");
            buttonText.textAlign = "center";
            buttonText.textBaseline = "middle";
            buttonText.x = button.x + controlButtonWidth / 2;
            buttonText.y = button.y + controlButtonHeight / 2;
            stage.addChild(buttonText);
        });

        // 3.1 Blue General Status
        new Rectangle(infoSectionWidth, 130, null, "#FFFFFF", 2)
            .loc(infoSectionX, 150);

        // Right-align all status text in two columns.
        const generalStatusOffsetX = 15;
        const statusLabelX = 1005 + generalStatusOffsetX;
        const statusValueX = 1115 + generalStatusOffsetX;
        const addStatusText = (text, font, x, y) => {
            const statusText = new createjs.Text(text, font, "#FFFFFF");
            statusText.textAlign = "right";
            statusText.textBaseline = "middle";
            statusText.x = x;
            statusText.y = y;
            stage.addChild(statusText);
        };

        addStatusText("Today's Income", "bold 22px Arial", statusLabelX, 180);
        addStatusText("$0", "bold 22px Arial", statusValueX, 180);
        addStatusText("Today's Completed", "15px Arial", statusLabelX, 215);
        addStatusText("0", "bold 18px Arial", statusValueX, 215);

        // Hint button and Attempts counter share one row.
        const hintButton = new createjs.Shape();
        hintButton.graphics
            .beginFill("#FFF2A8")
            .setStrokeStyle(2)
            .beginStroke("#000000")
            .drawRoundRect(0, 0, 80, 32, 8);
        hintButton.x = 855 + generalStatusOffsetX;
        hintButton.y = 237;
        hintButton.cursor = "pointer";
        stage.addChild(hintButton);

        const hintButtonLabel = new createjs.Text("Hint", "bold 15px Arial", "#000000");
        hintButtonLabel.textAlign = "center";
        hintButtonLabel.textBaseline = "middle";
        hintButtonLabel.x = hintButton.x + 40;
        hintButtonLabel.y = hintButton.y + 16;
        stage.addChild(hintButtonLabel);

        addStatusText("Attempts: 0", "bold 17px Arial", statusValueX, 253);

        // 3.2 Black Level Dropdown placeholder
        new Rectangle(infoSectionWidth, 45, null, "#FFFFFF", 2)
            .loc(infoSectionX, 295);
        new Label({text: "Level Dropdown", size: 16, color: "#FFFFFF"})
            .loc(855, 308);

        // 3.3 Green Level Status
        new Rectangle(infoSectionWidth, 265, null, "#FFFFFF", 2)
            .loc(infoSectionX, 355);

        const levelLeftX = 855;
        levelTitle = new createjs.Text("Level 1", "bold 26px Arial", "#FFFFFF");
        levelTitle.textAlign = "left";
        levelTitle.textBaseline = "middle";
        levelTitle.x = levelLeftX;
        levelTitle.y = 380;
        stage.addChild(levelTitle);

        levelRequirement = new createjs.Text(
            "Need 5 pieces to complete the level",
            "14px Arial",
            "#FFFFFF"
        );
        levelRequirement.textAlign = "left";
        levelRequirement.textBaseline = "middle";
        levelRequirement.x = levelLeftX;
        levelRequirement.y = 408;
        stage.addChild(levelRequirement);

        const progressLabel = new createjs.Text("Level Progress", "bold 13px Arial", "#FFFFFF");
        progressLabel.textAlign = "left";
        progressLabel.textBaseline = "middle";
        progressLabel.x = 855;
        progressLabel.y = 432;
        stage.addChild(progressLabel);

        const progressBar = new createjs.Shape();
        progressBar.graphics
            .beginFill("#174D17")
            .drawRoundRect(0, 0, 260, 16, 8);
        progressBar.x = 855;
        progressBar.y = 441;
        stage.addChild(progressBar);

        progressFill = new createjs.Shape();
        progressFill.graphics
            .beginFill("#FFF2A8")
            .drawRoundRect(0, 0, 0, 16, 8);
        progressFill.x = progressBar.x;
        progressFill.y = progressBar.y;
        stage.addChild(progressFill);

        function updateCampaignStatus() {
            if (!level) return;
            const levelNumber = String(level.id || "").match(/\d+/)?.[0] || campaign.levelIndex + 1;
            levelTitle.text = level.name || `Level ${levelNumber}`;
            levelRequirement.text = `Complete ${words.length} words to clear this level`;

            selectedWordLabels.forEach(label => stage.removeChild(label));
            selectedWordLabels.length = 0;
            words.forEach((word, index) => {
                const label = new createjs.Text(`${index + 1}. ${word.word}`, "13px Arial", "#FFFFFF");
                label.textAlign = "left";
                label.textBaseline = "middle";
                label.x = 855;
                label.y = 475 + index * 25;
                stage.addChild(label);
                selectedWordLabels.push(label);
            });

            const completionRatio = words.length ? wordIndex / words.length : 0;
            progressFill.graphics.clear()
                .beginFill("#FFF2A8")
                .drawRoundRect(0, 0, 260 * completionRatio, 16, 8);
            stage.update();
        }
        updateCampaignStatus();

        // Keep tool artwork above the rest of the scene, including the info panel.
        toolDisplayRefs.forEach(tool => stage.addChild(tool));
        stage.update(); // Refresh the stage.
    });
});
</script>
